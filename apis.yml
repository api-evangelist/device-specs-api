apis:
  - name: Device Specs API
    description: >-
      REST API for normalized mobile-device specifications, fronted by the RapidAPI gateway. Provides
      device specs by manufacturer/model, devices by brand, devices by chipset, and a query-param deep
      filter engine over the normalized metrics. Auth via RapidAPI key headers (x-rapidapi-key,
      x-rapidapi-host). Read-only — all four published operations are GET.
