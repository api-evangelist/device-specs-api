name: Device Specs API
description: >-
  A normalized mobile-device specifications REST API covering 12,000+ smartphones and 10,000+ models
  from 50+ manufacturers, delivering cleaned, strictly typed JSON for chipsets, display metrics
  (size, panel type, refresh rate, peak nits), CPU cores and clock speeds, RAM and storage options,
  battery capacity and charging, camera counts and resolutions, physical dimensions and IP rating,
  sound, connectivity, AnTuTu/Geekbench benchmarks, retail pricing in USD/EUR/GBP and EU energy-label
  data (energy class, battery endurance, repairability). Four read-only GET operations plus a
  documented deep query filter engine ({property}_{operator}={value}) supporting eq, contains, in,
  has, gt, gte, lt, lte and between across roughly 25 property aliases. Built and maintained by
  GranTurismo Engineering, distributed and metered through the RapidAPI marketplace with a free
  BASIC tier.
