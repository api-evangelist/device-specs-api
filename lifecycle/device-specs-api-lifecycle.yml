gateways:
  - name: RapidAPI
    host: gsmarenaparser.p.rapidapi.com
    status: live
    evidence: {url: "https://gsmarenaparser.p.rapidapi.com/", http_status: 401, body: "Invalid API key."}
    listing: https://rapidapi.com/controller2042000/api/gsmarenaparser
    listing_evidence: {url: "https://rapidapi.com/controller2042000/api/gsmarenaparser", html_title: GSMArenaParser}
  - name: RapidAPI (host named throughout the provider's docs)
    host: deviceultraparser.p.rapidapi.com
    status: unresolved
    evidence: {url: "https://deviceultraparser.p.rapidapi.com/", http_status: 404, body: "API doesn't exists"}
    listing_evidence: {url: "https://rapidapi.com/controller2042000/api/deviceultraparser", html_title: API Hub}
    note: >-
      ds.gtgroup.dev/docs, /llms.txt, /llms-full.txt, the .well-known/api-onboarding manifest and the
      OpenAPI x-rapidapi-host security-scheme description all name deviceultraparser.p.rapidapi.com as
      the production gateway and https://rapidapi.com/controller2042000/api/deviceultraparser as the
      signup/checkout link. Neither resolves. The gateway host root returns the same
      {"message":"API doesn't exists"} 404 that a control probe of a fabricated RapidAPI host returns,
      and the listing page renders the generic SPA shell (<title>API Hub</title>) — identical to a
      control probe of a fabricated listing slug — while the gsmarenaparser listing renders
      <title>GSMArenaParser</title> and its gateway host returns a real 401. Every documented
      onboarding path for this API therefore points at a listing that does not exist; the only working
      one is the gsmarenaparser listing, which the provider does not link anywhere.
  - name: API.market
    host: prod.api.market
    path: /api/v1/granturismo/device-specs-api
    status: unverified
    evidence: {url: "https://prod.api.market/api/v1/granturismo/device-specs-api/api/values/clean/devices", http_status: 400}
    note: >-
      llms.txt advertises an API.market gateway. The 400 returned is API.market's generic
      "No x-api-market-key" pre-routing response — a control probe of a fabricated seller/API path
      returns the identical body — and https://api.market/store/granturismo renders "No APIs available
      in this store yet." Not confirmed as a live distribution channel.
